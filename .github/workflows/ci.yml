name: CI - Marcaje EPP Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-frontend:
    name: Instalar, Probar y Compilar Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias limpias (npm ci)
        run: npm ci

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test

      - name: Compilar proyecto para produccion (TypeScript + Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
